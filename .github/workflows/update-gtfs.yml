name: Update GTFS Data

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: "カレンダー期間が変わっていなくても再生成する"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  update-gtfs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Download GTFS data from HODA
        run: |
          mkdir -p data/gtfs/asahikawa_denkikido
          mkdir -p data/gtfs/dohoku_bus
          mkdir -p data/gtfs/furano_bus

          curl -fSL --retry 3 --retry-delay 5 --connect-timeout 30 --max-time 120 \
            -o /tmp/asahikawa_denkikido.zip \
            "https://ckan.hoda.jp/dataset/24d1dd70-5395-4d6b-b41f-0d83e8eabdb9/resource/41ea2ac6-c6e4-47b2-9c1c-b482feaee17c/download/asahikawa_denki.zip"

          curl -fSL --retry 3 --retry-delay 5 --connect-timeout 30 --max-time 120 \
            -o /tmp/dohoku_bus.zip \
            "https://ckan.hoda.jp/dataset/24d1dd70-5395-4d6b-b41f-0d83e8eabdb9/resource/a89a7707-f346-45e7-8f98-0da0f3332531/download/dohoku_bus.zip"

          curl -fSL --retry 3 --retry-delay 5 --connect-timeout 30 --max-time 120 \
            -o /tmp/furano_bus.zip \
            "https://ckan.hoda.jp/dataset/24d1dd70-5395-4d6b-b41f-0d83e8eabdb9/resource/3623aa5b-7d0b-4621-a3c8-b09e55863d27/download/furano_bus.zip"

          for z in /tmp/asahikawa_denkikido.zip /tmp/dohoku_bus.zip /tmp/furano_bus.zip; do
            if zipinfo -1 "$z" | grep -Eq '^/|(^|/)\.\.(/|$)'; then
              echo "Error: unsafe zip entry detected in $z"
              exit 1
            fi
          done

          unzip -o /tmp/asahikawa_denkikido.zip -d data/gtfs/asahikawa_denkikido
          unzip -o /tmp/dohoku_bus.zip -d data/gtfs/dohoku_bus
          unzip -o /tmp/furano_bus.zip -d data/gtfs/furano_bus

      - name: Restore previous GTFS data from cache
        id: gtfs-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/gtfs-prev
          key: gtfs-prev-
          restore-keys: |
            gtfs-prev-

      - name: Compare calendar periods
        id: calendar
        run: bash scripts/compare-calendar.sh data/gtfs data/gtfs-prev

      # 期間が変わらなくても再生成したい場合がある．経路形状が欠けたまま
      # 公開された回の復旧が該当する．その手段が force 入力である．
      # 比較の結果は上書きせず別の出力として持つ．前期間データの扱いは
      # 強制かどうかではなく，期間が実際に変わったかで決めるためである．
      - name: Decide whether to regenerate
        id: gate
        env:
          FORCE: ${{ inputs.force }}
          CHANGED: ${{ steps.calendar.outputs.changed }}
        run: |
          if [ "$FORCE" = "true" ] || [ "$CHANGED" = "true" ]; then
            echo "regenerate=true" >> "$GITHUB_OUTPUT"
          else
            echo "regenerate=false" >> "$GITHUB_OUTPUT"
          fi
          echo "force=${FORCE:-false} changed=${CHANGED}"

      # Actions のキャッシュは 7 日間アクセスがないと退避される．
      # update-osm.yml は月次のため，本ワークフロー実行時には存在しないことが多い．
      # 見つからない場合は run-pfaedle.sh が Geofabrik から直接取得する．
      - name: Restore OSM data from cache
        if: steps.gate.outputs.regenerate == 'true'
        id: osm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/osm/hokkaido-latest.osm.pbf
          key: osm-hokkaido-
          restore-keys: |
            osm-hokkaido-

      - name: Generate shapes with pfaedle
        if: steps.gate.outputs.regenerate == 'true'
        run: |
          docker pull ghcr.io/ad-freiburg/pfaedle:latest
          bash scripts/run-pfaedle.sh data/osm/hokkaido-latest.osm.pbf data/gtfs

      # キャッシュミス時に取得した OSM データを次回実行のため保存する
      - name: Save OSM data to cache
        if: steps.gate.outputs.regenerate == 'true' && steps.osm-cache.outputs.cache-matched-key == ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/osm/hokkaido-latest.osm.pbf
          key: osm-hokkaido-${{ hashFiles('data/osm/hokkaido-latest.osm.pbf') }}

      # 期間が変わっていない強制実行では前期間ディレクトリを渡さない．
      # 渡すと convert-gtfs.ts が保持中の *_prev.json を不要とみなして消す．
      # 次期ダイヤが先に公開されている場合，消えるのは現に走っている方である．
      - name: Convert GTFS to JSON
        if: steps.gate.outputs.regenerate == 'true'
        env:
          CHANGED: ${{ steps.calendar.outputs.changed }}
        run: |
          if [ "$CHANGED" = "true" ]; then
            npx tsx scripts/convert-gtfs.ts data/gtfs public/data data/gtfs-prev
          else
            npx tsx scripts/convert-gtfs.ts data/gtfs public/data
          fi

      - name: Save current GTFS as previous for next run
        if: steps.gate.outputs.regenerate == 'true'
        run: |
          rm -rf data/gtfs-prev
          cp -r data/gtfs data/gtfs-prev

      # キャッシュの項目は書き換えられない．期間が同じ強制実行では
      # calendar.txt のハッシュも同じになり，保存が黙って捨てられる．
      # 実行 ID を付けて別の項目にし，復元は接頭辞で最新を拾う．
      - name: Cache current GTFS for next run
        if: steps.gate.outputs.regenerate == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/gtfs-prev
          key: gtfs-prev-${{ hashFiles('data/gtfs/*/calendar.txt') }}-${{ github.run_id }}

      - name: Check for changes
        id: diff
        run: |
          git add public/data/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected."
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update GTFS data $(date -u +%Y-%m-%d)"
          git push

      - name: Trigger deploy
        if: steps.diff.outputs.changed == 'true'
        run: gh workflow run deploy.yml
        env:
          GH_TOKEN: ${{ github.token }}
