name: CI

# Pull Request に対する検査をまとめる．
# deploy.yml は main への push でしか動かないため，PR の時点では
# 整形・lint・型・テストのいずれも検証されない状態だった．
#
# main への push は deploy.yml が同じ検査を行う．
# 本 workflow を push でも動かすと二重に実行されるため，PR のみとする．

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 整形と lint の両方を見る．Biome は版で整形結果が動くため
      # package.json 側で版を固定してある．
      - name: Biome check
        run: npm run check

      - name: Test
        run: npm test

      # tsc -b を含むため型検査も兼ねる．
      - name: Build
        run: npm run build
