version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # patterns を省略すると全依存が対象になる．
      # minor と patch を 1 本へ束ね，major だけ個別 PR として残す．
      # 注意: 宣言範囲がメジャー 1 つぶん以上遅れている依存では，旧メジャー内の
      # 更新がここへ載らない．更新先が範囲外の新しいメジャーへ向くためである．
      # 例は vitest の ^3.0.0 に対する 3.2.4 から 3.2.7 である．
      # 範囲の内側で足りる更新そのものは提案される（宣言の下限を上げる形．PR #145）．
      # この穴のうち脆弱性を伴うものは，.github/workflows/npm-audit.yml の
      # 週次実行が拾う．勧告の無いものは Issue #180 で扱う．
      # 経緯は docs/notes/2026-09-02-dependabot-npm-grouping.md の訂正の節を参照．
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # 2.x は設定スキーマとルールが変わる．移行は別途計画して行う．
      - dependency-name: "@biomejs/biome"
        update-types:
          - "version-update:semver-major"
