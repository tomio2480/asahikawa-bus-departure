version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # patterns を省略すると全依存が対象になる．
      # minor と patch を 1 本へ束ね，major だけ個別 PR として残す．
      # 注意: package.json の宣言が既に許す範囲へ収まる更新は，ここへ載らない．
      # 例は vitest の ^3.0.0 に対する 3.2.4 から 3.2.7 である．
      # この穴のうち脆弱性を伴うものは，.github/workflows/npm-audit.yml の
      # 週次実行が拾う．勧告の無い範囲内の更新は，依然としてどこにも載らない．
      # 経緯は docs/notes/2026-09-02-dependabot-npm-grouping.md の訂正の節を参照．
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # 2.x は設定スキーマとルールが変わる．移行は別途計画して行う．
      - dependency-name: "@biomejs/biome"
        update-types:
          - "version-update:semver-major"
